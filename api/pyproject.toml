[project]
name = "cuebox-api"
version = "0.1.0"
description = "Film Picker API — locally hosted Letterboxd watchlist recommendations"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "python-multipart",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pgvector",
    "apscheduler",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # Pin below 0.16: v0.16 expanded default rules from 59→413 and breaks CI.
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Restore pre-0.16 defaults so a future unpin does not re-enable 400+ rules at once.
# See https://astral.sh/blog/ruff-v0.16.0
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: large-watchlist performance benchmarks (set RUN_SLOW_PERF=1 to run)",
]
