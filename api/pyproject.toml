[project]
name = "cuebox-api"
version = "0.1.0"
description = "Film Picker API — locally hosted Letterboxd watchlist recommendations"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "python-multipart",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pgvector",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
