# Committed workflow config — portable core + Cuebox adapter.
# Skills reference keys via scripts/cursor-workflow-config.sh, not literal values.
version: 1
paths:
  artifact_root: workflow/issues
  workflow_docs: workflow/cursor-workflow
  skills_root: .cursor/skills
repository:
  owner: BlackLodgeLabs
  name: cuebox
  base_branch: main
  branch_pattern: cursor/issue-{issue}-{slug}
  label_prefix: cursor
  archive_branch: workflow/archive
orchestration:
  max_active_agents: 8
  handoff_pending_stale_minutes: 15
  deferral_comment_cooldown_minutes: 30
gates:
  workflow_regression: scripts/verify-workflow-paths.sh
tiering:
  workflow_loop_limits:
    bugbot: 1
    ci_autofix: 1
  application_loop_limits:
    bugbot: 3
    ci_autofix: 2
adapter:
  gates:
    application_default: scripts/verify-phase8-gates.sh
    application_ci_workflows:
      - api-ci
      - frontend-ci
  environment:
    health_url_frontend: http://localhost:3000/api/v1/health
    health_url_api: http://localhost:8000/api/v1/health
    database_url_host_test: postgresql+psycopg://cuebox:cuebox@localhost:5432/cuebox
