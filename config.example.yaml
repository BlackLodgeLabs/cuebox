# Copy this file to config.yaml and adjust values for your environment.
# API keys belong in .env, not in this file.

developer_mode: true

providers:
  metadata:
    tmdb:
      enabled: true
    omdb:
      enabled: true
  embedding:
    provider: openai
    model: text-embedding-3-small
  semantic_enrichment:
    provider: openai
    model: gpt-4o-mini
  ranking:
    provider: openai
    model: gpt-4o

recommendation:
  retrieval_candidate_limit: 100

enrichment:
  inter_film_delay_seconds: 0.25

scoring:
  theme_fit: 0.22
  emotional_fit: 0.20
  visual_tonal_fit: 0.13
  pacing_fit: 0.15
  complexity_fit: 0.10
  era_fit: 0.07
  obscurity_fit: 0.03
  viewing_context_fit: 0.05
  diversity_adjustment: 0.05
