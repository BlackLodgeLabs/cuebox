name: Feature request
description: Suggest a feature or enhancement for Cuebox
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / goal
      description: What problem does this solve? Why now?
      placeholder: As a user, I want...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable outcomes (checkboxes welcome)
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In scope and explicitly out of scope
      placeholder: |
        In scope:
        -
        Out of scope:
        -
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: User-visible behavior
      description: Screens, flows, or API changes
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Data / integration impact
      description: DB, sync, external APIs — or "none"
    validations:
      required: false
