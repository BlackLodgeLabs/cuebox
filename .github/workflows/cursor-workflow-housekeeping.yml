name: Cursor workflow housekeeping

# Manual drift check and one-time cleanup. Run from Actions → this workflow → Run workflow.

on:
  workflow_dispatch:
    inputs:
      strip_labels_on_closed:
        description: Strip cursor:* labels from all closed issues
        required: false
        type: boolean
        default: false
      sweep_stale_agent_branches:
        description: Delete agent side-branches for merged PRs (orphan cleanup)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Report drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/cursor-workflow-housekeeping.sh || true

      - name: Strip cursor labels on closed issues
        if: inputs.strip_labels_on_closed == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state closed --limit 100 --json number -q '.[].number' | while read -r n; do
            bash scripts/cursor-workflow-strip-cursor-labels.sh "$n"
          done
          echo "Stripped cursor labels from closed issues"

      - name: Sweep stale agent side-branches
        if: inputs.sweep_stale_agent_branches == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/cursor-workflow-delete-stale-branches.sh --sweep-merged
          echo "Swept stale agent side-branches for merged PRs"
