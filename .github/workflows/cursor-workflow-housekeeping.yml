name: Cursor workflow housekeeping

# Manual drift check and one-time cleanup. Run from Actions → this workflow → Run workflow.

on:
  workflow_dispatch:
    inputs:
      strip_labels_on_closed:
        description: Strip cursor:* labels from all closed issues
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Report drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/cursor-workflow-housekeeping.sh || true

      - name: Strip cursor labels on closed issues
        if: inputs.strip_labels_on_closed == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          CURSOR_LABELS="cursor:spec-needs-info cursor:spec-in-progress cursor:spec-ready cursor:plan-needs-info cursor:plan-in-progress cursor:plan-ready cursor:execute-in-progress cursor:execute-ready cursor:execute-passback cursor:changes-requested cursor:demo-in-progress cursor:demo-ready cursor:create-pr-in-progress cursor:create-pr-ready cursor:babysit-in-progress cursor:complete cursor:blocked"
          gh issue list --repo "$GITHUB_REPOSITORY" --state closed --limit 100 --json number -q '.[].number' | while read -r n; do
            for label in $CURSOR_LABELS; do
              gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label "$label" 2>/dev/null || true
            done
          done
          echo "Stripped cursor labels from closed issues"
