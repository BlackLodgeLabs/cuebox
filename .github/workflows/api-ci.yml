name: API CI

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  api-tests:
    # Service container instead of apt postgresql-16: ubuntu-latest (26.04
    # resolute) does not ship postgresql-16 or postgresql-16-pgvector.
    # Nothing else in this job uses apt, so the runner stays ubuntu-latest.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cuebox
          POSTGRES_PASSWORD: cuebox
          POSTGRES_DB: cuebox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql+psycopg://cuebox:cuebox@localhost:5432/cuebox
      TEST_DATABASE_URL: postgresql+psycopg://cuebox:cuebox@localhost:5432/cuebox
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Set up PostgreSQL with pgvector
        run: |
          cid="$(docker ps -q --filter ancestor=pgvector/pgvector:pg16)"
          test -n "$cid"
          docker exec "$cid" psql -v ON_ERROR_STOP=1 -U cuebox -d cuebox \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest tests/ -v
      - name: Lint with ruff
        run: ruff check app tests
