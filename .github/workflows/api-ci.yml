name: API CI

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql+psycopg://cuebox:cuebox@localhost:5432/cuebox
      TEST_DATABASE_URL: postgresql+psycopg://cuebox:cuebox@localhost:5432/cuebox
    steps:
      - uses: actions/checkout@v4
      # Use apt Postgres + pgvector instead of a Docker Hub service image to avoid
      # intermittent registry pull timeouts on GitHub-hosted runners.
      - name: Set up PostgreSQL with pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "CREATE USER cuebox WITH PASSWORD 'cuebox' CREATEDB;"
          sudo -u postgres psql -c "CREATE DATABASE cuebox OWNER cuebox;"
          sudo -u postgres psql -d cuebox -c "CREATE EXTENSION IF NOT EXISTS vector;"
          sudo -u postgres psql -d cuebox -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest tests/ -v
      - name: Lint with ruff
        run: ruff check app tests
