name: Cursor workflow handoff

# On workflow-state.json push: sync GitHub issue labels + status comment, then spawn next agent.
# Requires: CURSOR_API_KEY (repo secret). Optional: CURSOR_HANDOFF_GITHUB_TOKEN (PAT fallback).

on:
  push:
    branches:
      - 'cursor/issue-*'
    paths:
      - 'demos/**/workflow-state.json'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to resync status comment and labels for
        required: true
        type: string

permissions:
  issues: write
  contents: read

concurrency:
  group: cursor-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  handoff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq gh

      - name: Sync status and dispatch agents
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_HANDOFF_GITHUB_TOKEN: ${{ secrets.CURSOR_HANDOFF_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          chmod +x scripts/cursor-workflow-sync-github-status.sh

          mapfile -t files < <(
            if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '^demos/issue-[0-9]+/workflow-state\.json$' || true
            else
              git diff-tree --no-commit-id --name-only -r "$AFTER_SHA" | grep -E '^demos/issue-[0-9]+/workflow-state\.json$' || true
            fi
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No workflow-state.json changes in this push"
            exit 0
          fi

          handoff() {
            local stage="$1" issue="$2" branch="$3" state_file="$4"
            local prompt skill progress_stage agent_id=""

            case "$stage" in
              spec-ready)
                prompt="Use the planning skill for GitHub issue #${issue}. Branch: ${branch}. Read documents/cursor-workflow/WORKFLOW.md and demos/issue-${issue}/workflow-state.json."
                skill="planning"
                progress_stage="plan-in-progress"
                ;;
              plan-ready)
                prompt="Use the execute skill for GitHub issue #${issue}. Branch: ${branch}. Run all tests and gate scripts before pushing. Open draft PR to main if not already open."
                skill="execute"
                progress_stage="execute-in-progress"
                ;;
              execute-ready)
                prompt="Use the demo skill for GitHub issue #${issue}. Branch: ${branch}. Full Docker stack must be running. Follow demos/issue-${issue}/demo-spec.md."
                skill="demo"
                progress_stage="demo-in-progress"
                ;;
              demo-ready)
                prompt="Use the babysit-pr skill for GitHub issue #${issue}. Branch: ${branch}. Loop limits: bugbot 3, ci_autofix 2, total 10. Mark PR ready for review when clean."
                skill="babysit-pr"
                progress_stage="babysit-in-progress"
                ;;
              *)
                echo "::error::Unknown handoff stage '${stage}' for issue #${issue}"
                exit 1
                ;;
            esac

            echo "Handoff: issue #${issue} stage=${stage} branch=${branch}"

            if [ -n "${CURSOR_API_KEY:-}" ]; then
              payload=$(jq -n \
                --arg text "$prompt" \
                --arg url "$REPO_URL" \
                --arg ref "$branch" \
                '{prompt: {text: $text}, repos: [{url: $url, startingRef: $ref}], autoCreatePR: false}')
              http_code=$(curl -sS -o /tmp/cursor-agent.json -w "%{http_code}" \
                -X POST "https://api.cursor.com/v1/agents" \
                -u "${CURSOR_API_KEY}:" \
                -H "Content-Type: application/json" \
                -d "$payload")
              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                agent_id=$(jq -r '.id // .agentId // empty' /tmp/cursor-agent.json)
                echo "Cursor agent created: ${agent_id:-unknown}"
                HANDOFF_PROGRESS_STAGE="$progress_stage" \
                HANDOFF_ACTIVE_SKILL="$skill" \
                HANDOFF_ACTIVE_AGENT="$agent_id" \
                  scripts/cursor-workflow-sync-github-status.sh "$state_file"
                return 0
              fi
              echo "Cursor API returned ${http_code}: $(cat /tmp/cursor-agent.json)"
            fi

            if [ -n "${CURSOR_HANDOFF_GITHUB_TOKEN:-}" ]; then
              echo "${CURSOR_HANDOFF_GITHUB_TOKEN}" | gh auth login --with-token
              gh issue comment "$issue" --repo "${GITHUB_REPOSITORY}" \
                --body "@cursoragent ${prompt}"
              echo "Posted handoff comment on issue #${issue} (PAT fallback)"
              HANDOFF_PROGRESS_STAGE="$progress_stage" \
              HANDOFF_ACTIVE_SKILL="$skill" \
                scripts/cursor-workflow-sync-github-status.sh "$state_file"
              return 0
            fi

            echo "::warning::Set CURSOR_API_KEY or CURSOR_HANDOFF_GITHUB_TOKEN"
            exit 1
          }

          is_handoff_stage() {
            case "$1" in
              spec-ready|plan-ready|execute-ready|demo-ready) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_skip_stage() {
            case "$1" in
              blocked|complete|spec-in-progress|spec-needs-info|plan-in-progress|execute-in-progress|demo-in-progress|babysit-in-progress) return 0 ;;
              *) return 1 ;;
            esac
          }

          for file in "${files[@]}"; do
            git cat-file -e "${AFTER_SHA}:${file}" 2>/dev/null || continue
            git show "${AFTER_SHA}:${file}" > /tmp/workflow-state.json

            prev_stage=""
            if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}:${file}" 2>/dev/null; then
              prev_stage=$(git show "${BEFORE_SHA}:${file}" | jq -r '.stage // empty')
            fi

            issue=$(jq -r '.issue // empty' /tmp/workflow-state.json)
            branch=$(jq -r '.branch // empty' /tmp/workflow-state.json)
            stage=$(jq -r '.stage // empty' /tmp/workflow-state.json)

            if [ -z "$issue" ] || [ -z "$branch" ]; then
              echo "Skipping $file — missing issue or branch"
              continue
            fi

            # Always sync labels + status comment from committed state
            scripts/cursor-workflow-sync-github-status.sh /tmp/workflow-state.json

            if [ "$stage" = "$prev_stage" ]; then
              echo "Stage unchanged ($stage) — no handoff"
              continue
            fi
            if is_skip_stage "$stage"; then
              echo "No handoff for stage ${stage}"
              continue
            fi
            if is_handoff_stage "$stage"; then
              handoff "$stage" "$issue" "$branch" /tmp/workflow-state.json
            else
              echo "::warning::Unrecognized stage '${stage}' in ${file} (sync only)"
            fi
          done

  resync-status:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y jq gh

      - name: Resync issue status from branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.inputs.issue_number }}
        run: |
          set -euo pipefail
          chmod +x scripts/cursor-workflow-sync-github-status.sh
          STATE="demos/issue-${ISSUE}/workflow-state.json"
          BRANCH=$(git branch -r | grep -E "origin/cursor/issue-${ISSUE}-" | head -n1 | sed 's|^[[:space:]]*origin/||' || true)
          if [ -z "$BRANCH" ]; then
            echo "No cursor/issue-${ISSUE}-* branch found on origin"
            exit 1
          fi
          git fetch origin "$BRANCH"
          git show "origin/${BRANCH}:${STATE}" > /tmp/workflow-state.json
          scripts/cursor-workflow-sync-github-status.sh /tmp/workflow-state.json
          echo "Resynced issue #${ISSUE} from branch ${BRANCH}"
