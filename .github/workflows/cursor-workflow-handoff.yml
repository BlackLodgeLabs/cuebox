name: Cursor workflow handoff

# On every push to cursor/issue-*: sync issue labels + status comment from workflow.state.json.
# When workflow.state.json stage changes to a handoff value: ensure draft PR, spawn next cloud agent.
# Requires: CURSOR_API_KEY. Uses GITHUB_TOKEN for labels, comments, and draft PRs.

on:
  push:
    branches:
      - 'cursor/issue-*'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to resync (and optionally create draft PR)
        required: true
        type: string
      ensure_draft_pr:
        description: Create draft PR if missing
        required: false
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: write
  contents: write

concurrency:
  group: cursor-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  handoff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y jq gh

      - name: Load workflow scripts from main
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/cursor-workflow-scripts
          for script in cursor-workflow-sync-github-status.sh cursor-workflow-ensure-draft-pr.sh cursor-workflow-record-pr-on-branch.sh cursor-workflow-record-agent-on-branch.sh cursor-workflow-record-loops-on-branch.sh cursor-workflow-discover-agents.sh cursor-workflow-notify-complete.sh cursor-workflow-update-pr-body.sh cursor-workflow-merge-state.sh; do
            if git cat-file -e "origin/main:scripts/${script}" 2>/dev/null; then
              git show "origin/main:scripts/${script}" > "/tmp/cursor-workflow-scripts/${script}"
            elif git cat-file -e "HEAD:scripts/${script}" 2>/dev/null; then
              git show "HEAD:scripts/${script}" > "/tmp/cursor-workflow-scripts/${script}"
            else
              echo "::error::Missing workflow script: scripts/${script}"
              exit 1
            fi
            chmod +x "/tmp/cursor-workflow-scripts/${script}"
          done
          echo "SCRIPTS_DIR=/tmp/cursor-workflow-scripts" >> "$GITHUB_ENV"

      - name: Sync status, ensure PR, dispatch agents
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_HANDOFF_GITHUB_TOKEN: ${{ secrets.CURSOR_HANDOFF_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          WF="${SCRIPTS_DIR:-/tmp/cursor-workflow-scripts}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          STATE_PATH_PATTERN='^workflow/issues/issue-[0-9]+/workflow\.state\.json$'

          ISSUE=$(echo "$BRANCH" | sed -n 's/^cursor\/issue-\([0-9]\+\).*/\1/p')
          if [ -z "$ISSUE" ]; then
            echo "Could not parse issue number from branch ${BRANCH}"
            exit 0
          fi

          STATE_FILE="workflow/issues/issue-${ISSUE}/workflow.state.json"

          if ! git cat-file -e "${AFTER_SHA}:${STATE_FILE}" 2>/dev/null; then
            echo "No ${STATE_FILE} on ${BRANCH} — skipping"
            exit 0
          fi

          git show "${AFTER_SHA}:${STATE_FILE}" > /tmp/workflow.state.json

          ensure_pr_on_branch() {
            local issue="$1" branch="$2" state_file="$3"
            local pr
            pr=$("$WF/cursor-workflow-ensure-draft-pr.sh" "$issue" "$branch")
            "$WF/cursor-workflow-record-pr-on-branch.sh" "$state_file" "$pr" "$branch"
            jq --argjson pr "$pr" '.pr = $pr' "$state_file" > "${state_file}.tmp" && mv "${state_file}.tmp" "$state_file"
            echo "Draft PR #${pr} linked for issue #${issue}"
          }

          handoff() {
            local stage="$1" issue="$2" branch="$3" state_file="$4" prev_stage="${5:-}"
            local prompt skill progress_stage agent_id=""

            case "$stage" in
              spec-ready)
                ensure_pr_on_branch "$issue" "$branch" "$state_file"
                "$WF/cursor-workflow-sync-github-status.sh" "$state_file"
                prompt="Use the planning skill for GitHub issue #${issue}. Branch: ${branch}. Draft PR #$(jq -r '.pr' "$state_file") already exists — do not create a PR. Read workflow/cursor-workflow/WORKFLOW.md and workflow/issues/issue-${issue}/workflow.state.json."
                skill="planning"
                progress_stage="plan-in-progress"
                ;;
              plan-ready)
                if [ "$(jq -r '.pr // empty' "$state_file")" = "" ] || [ "$(jq -r '.pr' "$state_file")" = "null" ]; then
                  ensure_pr_on_branch "$issue" "$branch" "$state_file"
                fi
                prompt="Use the execute skill for GitHub issue #${issue}. Branch: ${branch}. Draft PR #$(jq -r '.pr' "$state_file") already exists — push commits only; do not create a PR. Run all tests and gate scripts before pushing."
                skill="execute"
                progress_stage="execute-in-progress"
                ;;
              execute-ready)
                if [ "$prev_stage" = "changes-requested" ]; then
                  prompt="Use the execute skill for GitHub issue #${issue}. Branch: ${branch}. Draft PR #$(jq -r '.pr' "$state_file") already exists — push commits only; do not create a PR. Post-complete scope changes requested; read SPEC.md and PLAN.md for updates. Run all tests and gate scripts before pushing."
                  skill="execute"
                  progress_stage="execute-in-progress"
                else
                  prompt="Use the demo skill for GitHub issue #${issue}. Branch: ${branch}. Full Docker stack must be running. Follow workflow/issues/issue-${issue}/demo/demo-spec.md."
                  skill="demo"
                  progress_stage="demo-in-progress"
                fi
                ;;
              demo-ready)
                prompt="Use the create-pr skill for GitHub issue #${issue}. Branch: ${branch}. Draft PR #$(jq -r '.pr' "$state_file") already exists — write workflow/issues/issue-${issue}/PR.md from spec, plan, commits, and demo notes; do not create a PR."
                skill="create-pr"
                progress_stage="create-pr-in-progress"
                ;;
              create-pr-ready)
                prompt="Use the babysit-pr skill for GitHub issue #${issue}. Branch: ${branch}. Loop limits: bugbot 3, ci_autofix 2, total 10. Mark PR ready for review when clean."
                skill="babysit-pr"
                progress_stage="babysit-in-progress"
                ;;
              *)
                echo "::error::Unknown handoff stage '${stage}' for issue #${issue}"
                exit 1
                ;;
            esac

            echo "Handoff: issue #${issue} stage=${stage} branch=${branch}"

            if [ -n "${CURSOR_API_KEY:-}" ]; then
              payload=$(jq -n \
                --arg text "$prompt" \
                --arg url "$REPO_URL" \
                --arg ref "$branch" \
                '{prompt: {text: $text}, repos: [{url: $url, startingRef: $ref}], autoCreatePR: false}')
              http_code=$(curl -sS -o /tmp/cursor-agent.json -w "%{http_code}" \
                -X POST "https://api.cursor.com/v1/agents" \
                -u "${CURSOR_API_KEY}:" \
                -H "Content-Type: application/json" \
                -d "$payload")
              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                agent_id=$(jq -r '.agent.id // .id // .agentId // empty' /tmp/cursor-agent.json)
                echo "Cursor agent created: ${agent_id:-unknown}"
                if [ -n "$agent_id" ]; then
                  jq --arg key "$skill" --arg id "$agent_id" \
                    '.agents //= {} | .agents[$key] = $id | .active_agent_id = $id | .active_skill = $skill' \
                    "$state_file" > "${state_file}.tmp" && mv "${state_file}.tmp" "$state_file"
                  "$WF/cursor-workflow-record-agent-on-branch.sh" "$state_file" "$skill" "$agent_id" "$branch" || true
                fi
                HANDOFF_PROGRESS_STAGE="$progress_stage" \
                HANDOFF_ACTIVE_SKILL="$skill" \
                HANDOFF_ACTIVE_AGENT="$agent_id" \
                  "$WF/cursor-workflow-sync-github-status.sh" "$state_file"
                return 0
              fi
              echo "Cursor API returned ${http_code}: $(cat /tmp/cursor-agent.json)"
            fi

            if [ -n "${CURSOR_HANDOFF_GITHUB_TOKEN:-}" ]; then
              echo "${CURSOR_HANDOFF_GITHUB_TOKEN}" | gh auth login --with-token
              gh issue comment "$issue" --repo "${GITHUB_REPOSITORY}" \
                --body "@cursoragent ${prompt}"
              echo "Posted handoff comment on issue #${issue} (PAT fallback)"
              HANDOFF_PROGRESS_STAGE="$progress_stage" \
              HANDOFF_ACTIVE_SKILL="$skill" \
                "$WF/cursor-workflow-sync-github-status.sh" "$state_file"
              return 0
            fi

            echo "::warning::Set CURSOR_API_KEY or CURSOR_HANDOFF_GITHUB_TOKEN"
            exit 1
          }

          handle_changes_requested() {
            local issue="$1" branch="$2" state_file="$3"
            local pr
            pr=$(jq -r '.pr // empty' "$state_file")
            if [ -n "$pr" ] && [ "$pr" != "null" ]; then
              gh pr ready "$pr" --undo --repo "${GITHUB_REPOSITORY}" 2>/dev/null || \
                gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f draft=true >/dev/null || \
                echo "::warning::Could not convert PR #${pr} to draft"
              echo "Converted PR #${pr} to draft for changes-requested"
            fi
            "$WF/cursor-workflow-record-loops-on-branch.sh" "$state_file" "$branch" || \
              echo "::warning::Could not persist loops.total_runs increment on branch"
            git fetch origin "$branch" --quiet 2>/dev/null || true
            if git cat-file -e "origin/${branch}:${STATE_FILE}" 2>/dev/null; then
              git show "origin/${branch}:${STATE_FILE}" > "$state_file"
            fi
            "$WF/cursor-workflow-sync-github-status.sh" "$state_file"
            echo "Handled changes-requested for issue #${issue} (no agent spawned)"
          }

          handle_passback() {
            local issue="$1" branch="$2" state_file="$3"
            local passback_to passback_reason agent_id prompt http_code
            passback_to=$(jq -r '.passback_to // empty' "$state_file")
            passback_reason=$(jq -r '.passback_reason // empty' "$state_file")
            agent_id=$(jq -r --arg k "$passback_to" '((.agents // {})[$k] // empty) | if type == "object" then .id // empty else . end' "$state_file")

            if [ -z "$passback_to" ] || [ "$passback_to" = "null" ] || [ -z "$agent_id" ] || [ "$agent_id" = "null" ]; then
              echo "Pass-back skipped — missing passback_to or agents.${passback_to}"
              return 1
            fi

            prompt="Resume execute for GitHub issue #${issue} on branch ${branch}. Pass-back reason: ${passback_reason}. Read workflow/issues/issue-${issue}/demo/demo-notes.md section 'Pass-back to execute' and use the execute skill. Draft PR #$(jq -r '.pr // empty' "$state_file") already exists — push commits only."

            if [ -n "${CURSOR_API_KEY:-}" ]; then
              payload=$(jq -n --arg text "$prompt" '{prompt: {text: $text}}')
              http_code=$(curl -sS -o /tmp/cursor-passback.json -w "%{http_code}" \
                -X POST "https://api.cursor.com/v1/agents/${agent_id}/runs" \
                -u "${CURSOR_API_KEY}:" \
                -H "Content-Type: application/json" \
                -d "$payload")
              if [ "$http_code" = "409" ]; then
                echo "::warning::Pass-back agent busy (409) — re-push after current run completes"
                return 0
              fi
              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                echo "Pass-back run started on agent ${agent_id}"
                HANDOFF_PROGRESS_STAGE="execute-in-progress" \
                HANDOFF_ACTIVE_SKILL="execute" \
                HANDOFF_ACTIVE_AGENT="$agent_id" \
                  "$WF/cursor-workflow-sync-github-status.sh" "$state_file"
                return 0
              fi
              echo "Pass-back API returned ${http_code}: $(cat /tmp/cursor-passback.json)"
            fi

            if [ -n "${CURSOR_HANDOFF_GITHUB_TOKEN:-}" ]; then
              echo "${CURSOR_HANDOFF_GITHUB_TOKEN}" | gh auth login --with-token
              gh issue comment "$issue" --repo "${GITHUB_REPOSITORY}" \
                --body "@cursoragent ${prompt}"
              HANDOFF_PROGRESS_STAGE="execute-in-progress" \
              HANDOFF_ACTIVE_SKILL="execute" \
              HANDOFF_ACTIVE_AGENT="$agent_id" \
                "$WF/cursor-workflow-sync-github-status.sh" "$state_file"
              return 0
            fi

            echo "::warning::Pass-back failed — set CURSOR_API_KEY or CURSOR_HANDOFF_GITHUB_TOKEN"
            return 1
          }

          is_handoff_stage() {
            case "$1" in
              spec-ready|plan-ready|execute-ready|demo-ready|create-pr-ready) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_skip_stage() {
            case "$1" in
              blocked|complete|spec-in-progress|spec-needs-info|plan-needs-info|plan-in-progress|execute-in-progress|demo-in-progress|create-pr-in-progress|babysit-in-progress|changes-requested|execute-passback) return 0 ;;
              *) return 1 ;;
            esac
          }

          branch=$(jq -r '.branch // empty' /tmp/workflow.state.json)
          stage=$(jq -r '.stage // empty' /tmp/workflow.state.json)

          if [ -z "$branch" ]; then
            echo "Skipping — missing branch in ${STATE_FILE}"
            exit 0
          fi

          # Always sync labels + status comment on every cloud-agent push
          if [ -n "${CURSOR_API_KEY:-}" ]; then
            "$WF/cursor-workflow-discover-agents.sh" /tmp/workflow.state.json "$branch" || true
            git fetch origin "$branch" --quiet 2>/dev/null || true
            if git cat-file -e "origin/${branch}:${STATE_FILE}" 2>/dev/null; then
              git show "origin/${branch}:${STATE_FILE}" > /tmp/workflow.state.json
            fi
          fi
          "$WF/cursor-workflow-sync-github-status.sh" /tmp/workflow.state.json
          if [ "$stage" = "complete" ]; then
            "$WF/cursor-workflow-notify-complete.sh" /tmp/workflow.state.json || true
          fi

          PR_MD_FILE="workflow/issues/issue-${ISSUE}/PR.md"
          pr_md_changed=false
          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -qF "$PR_MD_FILE"; then
              pr_md_changed=true
            fi
          else
            if git diff-tree --no-commit-id --name-only -r "$AFTER_SHA" | grep -qF "$PR_MD_FILE"; then
              pr_md_changed=true
            fi
          fi
          if [ "$pr_md_changed" = "true" ] && git cat-file -e "${AFTER_SHA}:${PR_MD_FILE}" 2>/dev/null; then
            git show "${AFTER_SHA}:${PR_MD_FILE}" > /tmp/PR.md
            "$WF/cursor-workflow-update-pr-body.sh" /tmp/workflow.state.json /tmp/PR.md || true
          fi

          state_changed=false
          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -qE "$STATE_PATH_PATTERN"; then
              state_changed=true
            fi
          else
            if git diff-tree --no-commit-id --name-only -r "$AFTER_SHA" | grep -qE "$STATE_PATH_PATTERN"; then
              state_changed=true
            fi
          fi

          if [ "$state_changed" != "true" ]; then
            echo "workflow.state.json unchanged — sync only (stage=${stage})"
            exit 0
          fi

          prev_stage=""
          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}:${STATE_FILE}" 2>/dev/null; then
            prev_stage=$(git show "${BEFORE_SHA}:${STATE_FILE}" | jq -r '.stage // empty')
          fi

          if [ "$stage" = "$prev_stage" ]; then
            echo "Stage unchanged ($stage) — no handoff"
            exit 0
          fi

          if [ "$stage" = "changes-requested" ]; then
            handle_changes_requested "$ISSUE" "$branch" /tmp/workflow.state.json
            exit 0
          fi

          passback_to=$(jq -r '.passback_to // empty' /tmp/workflow.state.json)
          if [ "$stage" = "execute-passback" ] && [ -n "$passback_to" ] && [ "$passback_to" != "null" ]; then
            handle_passback "$ISSUE" "$branch" /tmp/workflow.state.json || true
            exit 0
          fi

          if is_skip_stage "$stage"; then
            echo "No handoff for stage ${stage}"
            exit 0
          fi
          if is_handoff_stage "$stage"; then
            handoff "$stage" "$ISSUE" "$branch" /tmp/workflow.state.json "$prev_stage"
          else
            echo "::warning::Unrecognized stage '${stage}' in ${STATE_FILE} (sync only)"
          fi

  resync-status:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y jq gh

      - name: Load workflow scripts from main
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/cursor-workflow-scripts
          for script in cursor-workflow-sync-github-status.sh cursor-workflow-ensure-draft-pr.sh cursor-workflow-record-pr-on-branch.sh cursor-workflow-record-agent-on-branch.sh cursor-workflow-record-loops-on-branch.sh cursor-workflow-discover-agents.sh cursor-workflow-notify-complete.sh cursor-workflow-update-pr-body.sh cursor-workflow-merge-state.sh; do
            if git cat-file -e "origin/main:scripts/${script}" 2>/dev/null; then
              git show "origin/main:scripts/${script}" > "/tmp/cursor-workflow-scripts/${script}"
            elif git cat-file -e "HEAD:scripts/${script}" 2>/dev/null; then
              git show "HEAD:scripts/${script}" > "/tmp/cursor-workflow-scripts/${script}"
            else
              echo "::error::Missing workflow script: scripts/${script}"
              exit 1
            fi
            chmod +x "/tmp/cursor-workflow-scripts/${script}"
          done
          echo "SCRIPTS_DIR=/tmp/cursor-workflow-scripts" >> "$GITHUB_ENV"

      - name: Resync issue status and ensure draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE: ${{ github.event.inputs.issue_number }}
          ENSURE_PR: ${{ github.event.inputs.ensure_draft_pr }}
        run: |
          set -euo pipefail
          WF="${SCRIPTS_DIR:-/tmp/cursor-workflow-scripts}"
          STATE="workflow/issues/issue-${ISSUE}/workflow.state.json"
          mapfile -t BRANCHES < <(git branch -r | grep -E "origin/cursor/issue-${ISSUE}-" | sed 's|^[[:space:]]*origin/||' || true)
          BRANCH="${BRANCHES[0]:-}"
          if [ -z "$BRANCH" ]; then
            echo "No cursor/issue-${ISSUE}-* branch found on origin"
            exit 1
          fi
          git fetch origin "$BRANCH"
          git show "origin/${BRANCH}:${STATE}" > /tmp/workflow.state.json
          if [ -n "${CURSOR_API_KEY:-}" ]; then
            "$WF/cursor-workflow-discover-agents.sh" /tmp/workflow.state.json "$BRANCH" || true
            git fetch origin "$BRANCH" --quiet 2>/dev/null || true
            if git cat-file -e "origin/${BRANCH}:${STATE}" 2>/dev/null; then
              git show "origin/${BRANCH}:${STATE}" > /tmp/workflow.state.json
            fi
          fi
          if [ "${ENSURE_PR}" = "true" ]; then
            PR=$("$WF/cursor-workflow-ensure-draft-pr.sh" "$ISSUE" "$BRANCH")
            "$WF/cursor-workflow-record-pr-on-branch.sh" /tmp/workflow.state.json "$PR" "$BRANCH"
            git fetch origin "$BRANCH"
            git show "origin/${BRANCH}:${STATE}" > /tmp/workflow.state.json
          fi
          "$WF/cursor-workflow-sync-github-status.sh" /tmp/workflow.state.json
          STAGE=$(jq -r '.stage // empty' /tmp/workflow.state.json)
          if [ "$STAGE" = "complete" ]; then
            "$WF/cursor-workflow-notify-complete.sh" /tmp/workflow.state.json || true
          fi
          echo "Done for issue #${ISSUE} on ${BRANCH}"
