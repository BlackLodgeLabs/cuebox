services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuebox}
      POSTGRES_DB: ${POSTGRES_DB:-cuebox}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      API_UPSTREAM_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    depends_on:
      - postgres
    env_file: .env
    environment:
      CUEBOX_IN_BACKUP_CONTAINER: "1"
      PGHOST: postgres
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-2}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    volumes:
      - ./backups:/backups
    restart: unless-stopped

volumes:
  postgres_data:
